org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Keep the legacy Kotlin/Android integration required by Gobley until its KMP backend migrates.
# These documented AGP 9 migration opt-outs must be removed before moving to AGP 10.
android.builtInKotlin=false
android.newDsl=false
# Gobley registers generated JNI directories through Provider-backed legacy source sets.
android.sourceset.disallowProvider=false
