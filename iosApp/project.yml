# Xcode project spec. Generate the project on macOS with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: iosApp
options:
  bundleIdPrefix: com.ezfiles
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # Kotlin/Native frameworks are not bitcode-enabled.
    ENABLE_BITCODE: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Xfiles
        UILaunchScreen: {}
        # Lets the picker open files in place from Files/iCloud providers.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Documents
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.text, public.image, org.openxmlformats.wordprocessingml.document, org.openxmlformats.spreadsheetml.sheet, org.openxmlformats.presentationml.presentation, org.oasis-open.opendocument.text, org.oasis-open.opendocument.spreadsheet, org.oasis-open.opendocument.presentation, org.idpf.epub-container, public.zip-archive]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezfiles.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "Shared"]
    preBuildScripts:
      - name: Build Kotlin framework and Rust engine
        # Gobley builds the Rust static library for the active iOS target and
        # Kotlin/Native links it into Shared.framework.
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
